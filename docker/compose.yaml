# GPU host stack: ROS 2 + Gazebo sim driven from JupyterLab, plus the
# LocateAnything grounding server. Both services need an NVIDIA GPU and
# the NVIDIA Container Toolkit installed on the host:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/
# Verify with:  docker run --rm --gpus all ubuntu:24.04 nvidia-smi
#
#   docker compose -f docker/compose.yaml up -d --build
#   docker compose -f docker/compose.yaml logs -f sim     # Jupyter URL
#
# Ports are published on 127.0.0.1 only — reach the notebook from your
# laptop with an SSH tunnel, not by exposing 8888 to the internet:
#   ./docker/tunnel.sh user@gpu-host
# which is shorthand for:
#   ssh -N -L 8888:localhost:8888 -L 6080:localhost:6080 \
#          -L 8801:localhost:8801 user@gpu-host

services:
  sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: tb3-semantic-nav-sim
    ports:
      - "127.0.0.1:8888:8888"  # JupyterLab
      - "127.0.0.1:${GUI_PORT:-6080}:6080"  # noVNC desktop (RViz / Gazebo GUI)
      - "127.0.0.1:8801:8801"  # grounding server (shares this netns)
    volumes:
      - ..:/home/ubuntu/ws
      # Colcon artifacts stay off the bind mount. These paths are created
      # (and chown'd to ubuntu) in the Dockerfile so the named volumes are
      # seeded with the right ownership — see the comment there.
      - ws_build:/home/ubuntu/ws/build
      - ws_install:/home/ubuntu/ws/install
      - ws_log:/home/ubuntu/ws/log
      # Best-view frames for grounding; kept out of the repo checkout.
      - evidence:/home/ubuntu/.tb3_semantic_nav
    shm_size: "2gb"
    environment:
      # Jupyter reads this directly. Override it in a .env file or the
      # shell; the fallback exists so `up` is one command, not two.
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-tb3}
      - TURTLEBOT3_MODEL=waffle_pi
      # The virtual desktop docker/start_gui.sh serves over noVNC. Set
      # unconditionally so RViz and the Gazebo GUI need no per-command
      # prefix, but the launch files do not treat "DISPLAY is set" as
      # "a GUI can run": they probe for the X socket itself, so a launch
      # started before (or without) start_gui.sh still comes up headless
      # instead of dying in Qt with "cannot connect to X server :99".
      - DISPLAY=:99
      # Load-bearing, and the whole reason DISPLAY above is safe to set.
      # gz-sim's Sensors system must render the robot's camera through
      # EGL on the NVIDIA device no matter what DISPLAY says; the :99
      # desktop is Xvfb, i.e. llvmpipe, and pointing sensor rendering at
      # it would quietly drop the real-time factor through the floor.
      # This pins --headless-rendering on; the GUI *clients* are
      # unaffected and keep drawing on :99.
      - TB3_HEADLESS_RENDERING=true
      # Optional VNC password for the noVNC desktop. Unset means no auth,
      # which is the same posture as the grounding server on 8801: safe
      # only because nothing is published beyond the host's loopback.
      - TB3_VNC_PASSWORD=${TB3_VNC_PASSWORD:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              # `gpu` is the coarse capability compose understands; the
              # finer-grained graphics/display caps that EGL rendering
              # needs come from NVIDIA_DRIVER_CAPABILITIES=all, set in
              # the image. Both are required — the compose entry alone
              # gives compute only, which renders nothing.
              capabilities: [gpu]

  grounding:
    build:
      context: .
      dockerfile: Dockerfile.grounding
    image: tb3-semantic-nav-grounding
    # Shares sim's netns so the query node's default 127.0.0.1:8801 works.
    network_mode: "service:sim"
    volumes:
      - ../grounding:/app
      # LocateAnything-3B is ~7 GB and downloads from HuggingFace on first
      # start. Without this volume every restart re-fetches it.
      - hf_cache:/hf-cache
    environment:
      # Set to `mock` to fall back to the GPU-free HSV colour heuristic.
      - GROUNDING_BACKEND=${GROUNDING_BACKEND:-locate_anything}
      # LocateAnything-3B is a licence-gated download. If the first start
      # dies with a 401/403 from huggingface.co, accept the terms on the
      # model page and put a read token in docker/.env as HF_TOKEN —
      # transformers reads this variable directly. Harmless when empty.
      - HF_TOKEN=${HF_TOKEN:-}
    depends_on:
      - sim
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ws_build:
  ws_install:
  ws_log:
  evidence:
  hf_cache:
