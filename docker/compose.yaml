services:
  sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: tb3-semantic-nav-sim
    # No `platform:` key — ROS 2 Jazzy and Gazebo Harmonic both ship arm64
    # debs, so this builds and runs natively on Apple Silicon. Do not
    # reintroduce linux/amd64: that is what forced Rosetta emulation.
    ports:
      - "6080:80"    # noVNC desktop
      - "8801:8801"  # grounding server
    volumes:
      - ..:/home/ubuntu/ws
      # Colcon artifacts stay off the bind mount.
      - ws_build:/home/ubuntu/ws/build
      - ws_install:/home/ubuntu/ws/install
      - ws_log:/home/ubuntu/ws/log
    shm_size: "1gb"
    environment:
      - RESOLUTION=1600x900
      # gz-sim's Sensors system renders camera frames through OGRE, which
      # needs an X display even when the server runs headless (`-s`).
      - DISPLAY=:1

  grounding:
    build:
      context: .
      dockerfile: Dockerfile.grounding
    # Shares sim's netns so the query node's default 127.0.0.1:8801 works.
    network_mode: "service:sim"
    volumes:
      - ../grounding:/app
    depends_on:
      - sim

volumes:
  ws_build:
  ws_install:
  ws_log:
