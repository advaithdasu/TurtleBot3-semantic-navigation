# ros_gz_bridge topic map for the TurtleBot3 waffle_pi under Gazebo Harmonic.
#
# Adapted from turtlebot3_gazebo's params/turtlebot3_waffle_pi_bridge.yaml
# with ONE deliberate difference: /cmd_vel is bridged as
# geometry_msgs/msg/Twist, not TwistStamped. Upstream chose TwistStamped,
# but every velocity publisher in this workspace — coordinator_node,
# startup_map_warmup_node, fake_semantic_navigation_node — publishes plain
# Twist, and so does Nav2 Jazzy by default (its collision_monitor is the
# last hop onto /cmd_vel). Bridging Twist here keeps all of that code
# unchanged; gz's DiffDrive plugin subscribes to gz.msgs.Twist either way.
#
# If Nav2 ever starts publishing TwistStamped — a future distro flipping
# enable_stamped_cmd_vel to true — the robot will stop responding to
# navigation goals and this entry is what needs to change.
#
# /camera/image_raw is NOT listed: it is carried by ros_gz_image's
# image_bridge instead, which does the zero-copy image conversion.

# gz topic published by the simulator core
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# gz topic published by JointState plugin
- ros_topic_name: "joint_states"
  gz_topic_name: "joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# gz topic published by DiffDrive plugin
- ros_topic_name: "odom"
  gz_topic_name: "odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# gz topic published by DiffDrive plugin (odom -> base_footprint)
- ros_topic_name: "tf"
  gz_topic_name: "tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# gz topic subscribed to by DiffDrive plugin
- ros_topic_name: "cmd_vel"
  gz_topic_name: "cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# gz topic published by IMU plugin
- ros_topic_name: "imu"
  gz_topic_name: "imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# gz topic published by Sensors plugin (gpu_lidar)
- ros_topic_name: "scan"
  gz_topic_name: "scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# gz topic published by Sensors plugin (camera)
- ros_topic_name: "camera/camera_info"
  gz_topic_name: "camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
