# ============================================================
# tb3_detector  —  detector_node configuration
# ============================================================
# All values here are overridable via launch arguments or
# ros2 run ... --ros-args -p key:=value.

detector_node:
  ros__parameters:
    # ── Model ──────────────────────────────────────────────
    # IMPORTANT: set this to the actual path of your downloaded weights.
    # Relative paths are resolved from <pkg_share>/models/.
    # See README → STOP HERE checkpoint.
    model_path: "yolov8n.pt"          # <- filename inside models/ folder

    # ── Inference ──────────────────────────────────────────
    conf_threshold: 0.12              # lowered from 0.15 for bench edge cases
    # "auto" resolves to cuda:0 when a GPU is visible, else cpu — see
    # detector_core.resolve_device. Pin "cuda:1" etc. to choose a device
    # on a multi-GPU host. NOTE: detector.launch.py passes this key
    # inline, which wins over this file; change the launch default too.
    device: "auto"
    enable_tracking: false            # true = ByteTrack; track_id populated

    # Minimum seconds between YOLO inferences. Frames arriving sooner are
    # dropped in the image callback. Was 0.2 (~5 Hz) because CPU inference
    # could not sustain more; YOLOv8n on a GPU runs an order of magnitude
    # faster, so this is now 0.1 (~10 Hz) — better evidence frames and
    # tighter localization without saturating anything. The camera itself
    # publishes at the stock 30 Hz.
    min_inference_interval_sec: 0.1

    # ── Class filter ───────────────────────────────────────
    # List COCO detector_label values from semantic_targets.yaml (validated in sim).
    # IMPORTANT: use detector_label strings, NOT semantic_name or gazebo_model names.
    # IMPORTANT: do NOT use bare [] — rclpy cannot infer a type from an empty
    #            YAML list and will crash. Use [""] to accept ALL classes.
    #
    #   semantic  →  detector_label  (see config/semantic_targets.yaml)
    #   table     →  "bench"
    #   stop_sign →  "stop sign"
    #   person    →  "person"
    #   sofa      →  "couch"
    #   chair     →  "chair"
    #   box       →  "suitcase"   (experimental — COCO has no "box" class;
    #                              hit-rate measured by grounding/eval)
    class_filter: ["bench", "person", "couch", "chair", "suitcase"]  # "stop sign" temporarily removed — restore for full 3-target testing

    # ── Topics ─────────────────────────────────────────────
    image_topic:        "/camera/image_raw"
    camera_info_topic:  "/camera/camera_info"
    detections_topic:   "~/detections"     # resolves to /detector_node/detections
    debug_image_topic:  "~/debug_image"    # resolves to /detector_node/debug_image

    # ── Debug ──────────────────────────────────────────────
    publish_debug_image: true
    queue_size: 5
